<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
    <rect width="800" height="450" rx="16" fill="#0a101d"/>
    <rect x="2" y="2" width="796" height="446" rx="14" stroke="#1e293b" stroke-width="2"/>
    <text x="40" y="50" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="600">COMPUTER VISION &amp; BIOMETRICS // 2024</text>
    <text x="40" y="80" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Mass Attendance Pipeline: Face Embeddings &amp; L2 Normalization</text>

    <!-- Pipeline steps -->
    <rect x="50" y="140" width="120" height="180" rx="8" fill="#131e33" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="110" y="170" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Video Ingestion</text>
    <text x="110" y="200" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">RTSP / Camera Stream</text>
    <text x="110" y="225" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Face Detection</text>
    <text x="110" y="250" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Facial Alignment</text>

    <path d="M175 230 L220 230" stroke="#0ea5e9" stroke-width="2"/>

    <rect x="220" y="140" width="160" height="180" rx="8" fill="#131e33" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="300" y="170" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. Backbone Networks</text>
    <text x="300" y="200" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">ResNet / GhostFaceNet</text>
    <text x="300" y="225" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">FaceNet Embeddings</text>
    <text x="300" y="255" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Dense Feature Vector</text>

    <path d="M385 230 L430 230" stroke="#8b5cf6" stroke-width="2"/>

    <rect x="430" y="140" width="160" height="180" rx="8" fill="#131e33" stroke="#10b981" stroke-width="1.5"/>
    <text x="510" y="170" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. L2 Normalization</text>
    <text x="510" y="200" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Hyper-sphere Mapping</text>
    <text x="510" y="225" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">2D / 3D Visualization</text>
    <text x="510" y="250" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">t-SNE &amp; PCA Cluster</text>

    <path d="M595 230 L640 230" stroke="#10b981" stroke-width="2"/>

    <rect x="640" y="140" width="120" height="180" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="700" y="170" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. Attendance</text>
    <text x="700" y="200" fill="#d1fae5" font-family="sans-serif" font-size="10" text-anchor="middle">Cosine Matching</text>
    <text x="700" y="225" fill="#d1fae5" font-family="sans-serif" font-size="10" text-anchor="middle">Verification Pass</text>
    <text x="700" y="260" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">REAL-TIME LOG</text>
  </svg>