<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
    <rect width="800" height="450" rx="16" fill="#0b1320"/>
    <rect x="2" y="2" width="796" height="446" rx="14" stroke="#1e293b" stroke-width="2"/>
    <text x="40" y="50" fill="#14b8a6" font-family="monospace" font-size="14" font-weight="600">HEALTHCARE AI // SWAMI RAMA HIMALAYAN HOSPITAL</text>
    <text x="40" y="80" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Hospital Document OCR Pipeline for Clinical Records</text>

    <!-- Step 1: Noisy Hospital Document -->
    <rect x="50" y="140" width="110" height="150" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="105" y="170" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Noisy Scan</text>
    <line x1="65" y1="190" x2="145" y2="190" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2 3"/>
    <line x1="65" y1="210" x2="135" y2="210" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 4"/>
    <line x1="65" y1="230" x2="120" y2="230" stroke="#ef4444" stroke-width="2"/>
    <text x="105" y="260" fill="#fca5a5" font-family="sans-serif" font-size="9" text-anchor="middle">Doctor Handwriting</text>

    <!-- Flow Arrow -->
    <path d="M165 215 L205 215" stroke="#14b8a6" stroke-width="2"/>

    <!-- Step 2: Preprocessing & Denoising -->
    <rect x="205" y="140" width="125" height="150" rx="8" fill="#13232f" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="267" y="170" fill="#2dd4bf" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Preprocessing</text>
    <text x="267" y="200" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Noise Filtering</text>
    <text x="267" y="220" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Contrast Stretch</text>
    <text x="267" y="240" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Adaptive Binarize</text>

    <!-- Flow Arrow -->
    <path d="M335 215 L375 215" stroke="#14b8a6" stroke-width="2"/>

    <!-- Step 3: Layout Analysis -->
    <rect x="375" y="140" width="125" height="150" rx="8" fill="#13232f" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="437" y="170" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Layout Analysis</text>
    <rect x="390" y="190" width="40" height="30" rx="2" fill="#0e7490" opacity="0.6"/>
    <rect x="440" y="190" width="45" height="30" rx="2" fill="#0369a1" opacity="0.6"/>
    <rect x="390" y="230" width="95" height="40" rx="2" fill="#155e75" opacity="0.6"/>
    <text x="437" y="255" fill="#e0f2fe" font-family="sans-serif" font-size="9" text-anchor="middle">Tables &amp; Fields</text>

    <!-- Flow Arrow -->
    <path d="M505 215 L545 215" stroke="#14b8a6" stroke-width="2"/>

    <!-- Step 4: OCR Engine & Post-processing -->
    <rect x="545" y="140" width="105" height="150" rx="8" fill="#13232f" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="597" y="170" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">OCR + Normalizer</text>
    <text x="597" y="200" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Text Recognition</text>
    <text x="597" y="225" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Domain Lexicon</text>
    <text x="597" y="250" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Medical Vocab</text>

    <!-- Flow Arrow -->
    <path d="M655 215 L685 215" stroke="#10b981" stroke-width="2"/>

    <!-- Step 5: Structured Data Output -->
    <rect x="685" y="130" width="85" height="170" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="727" y="160" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Structured</text>
    <text x="727" y="178" fill="#a7f3d0" font-family="sans-serif" font-size="10" text-anchor="middle">EHR Data</text>
    <text x="727" y="210" fill="#ecfdf5" font-family="monospace" font-size="8" text-anchor="middle">{</text>
    <text x="727" y="225" fill="#ecfdf5" font-family="monospace" font-size="8" text-anchor="middle">"id": 104,</text>
    <text x="727" y="240" fill="#ecfdf5" font-family="monospace" font-size="8" text-anchor="middle">"diag": ...</text>
    <text x="727" y="255" fill="#ecfdf5" font-family="monospace" font-size="8" text-anchor="middle">}</text>
    <text x="727" y="285" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">DEPLOYED</text>
  </svg>