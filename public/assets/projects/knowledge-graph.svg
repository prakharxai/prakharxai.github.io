<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
    <rect width="800" height="450" rx="16" fill="#0d1424"/>
    <rect x="2" y="2" width="796" height="446" rx="14" stroke="#1e293b" stroke-width="2"/>
    <text x="40" y="50" fill="#a855f7" font-family="monospace" font-size="14" font-weight="600">SEMANTIC NETWORKS // 2025</text>
    <text x="40" y="80" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Knowledge Graph for Sanskrit &amp; Hindi Historical Texts</text>

    <!-- Graph network visualization -->
    <line x1="240" y1="220" x2="380" y2="170" stroke="#6366f1" stroke-width="2"/>
    <line x1="240" y1="220" x2="320" y2="310" stroke="#06b6d4" stroke-width="2"/>
    <line x1="380" y1="170" x2="520" y2="200" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="320" y1="310" x2="480" y2="310" stroke="#10b981" stroke-width="2"/>
    <line x1="480" y1="310" x2="520" y2="200" stroke="#ec4899" stroke-width="2"/>
    <line x1="520" y1="200" x2="650" y2="240" stroke="#38bdf8" stroke-width="2"/>

    <!-- Central Nodes -->
    <circle cx="240" cy="220" r="32" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="240" y="215" fill="#e0e7ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Entity</text>
    <text x="240" y="232" fill="#a5b4fc" font-family="sans-serif" font-size="9" text-anchor="middle">Character</text>

    <circle cx="380" cy="170" r="36" fill="#142c40" stroke="#38bdf8" stroke-width="2"/>
    <text x="380" y="165" fill="#f0f9ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Event</text>
    <text x="380" y="182" fill="#7dd3fc" font-family="sans-serif" font-size="9" text-anchor="middle">Historical Occurrence</text>

    <circle cx="320" cy="310" r="30" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="320" y="307" fill="#ecfdf5" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Place</text>
    <text x="320" y="322" fill="#a7f3d0" font-family="sans-serif" font-size="8" text-anchor="middle">Geography</text>

    <circle cx="520" cy="200" r="36" fill="#311042" stroke="#e879f9" stroke-width="2"/>
    <text x="520" y="195" fill="#fae8ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Lineage</text>
    <text x="520" y="212" fill="#f0abfc" font-family="sans-serif" font-size="9" text-anchor="middle">Genealogy</text>

    <circle cx="480" cy="310" r="28" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="480" y="307" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Timeline</text>
    <text x="480" y="322" fill="#cbd5e1" font-family="sans-serif" font-size="8" text-anchor="middle">Temporal</text>

    <circle cx="650" cy="240" r="34" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="2"/>
    <text x="650" y="235" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Inference</text>
    <text x="650" y="252" fill="#7dd3fc" font-family="sans-serif" font-size="8" text-anchor="middle">Multi-Hop Query</text>

    <!-- Edge Labels -->
    <rect x="290" y="180" width="60" height="18" rx="4" fill="#0f172a"/>
    <text x="320" y="193" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">participated_in</text>
    
    <rect x="420" y="170" width="60" height="18" rx="4" fill="#0f172a"/>
    <text x="450" y="183" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">descendant_of</text>
  </svg>