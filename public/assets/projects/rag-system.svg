<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
    <rect width="800" height="450" rx="16" fill="#090e1a"/>
    <rect x="2" y="2" width="796" height="446" rx="14" stroke="#1f293d" stroke-width="2"/>
    <text x="40" y="50" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="600">RETRIEVAL-AUGMENTED GENERATION // 2026</text>
    <text x="40" y="80" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Grounded Citation RAG System with Passage Attribution</text>

    <!-- Stage 1: Document Ingestion -->
    <rect x="40" y="140" width="130" height="220" rx="8" fill="#131b2e" stroke="#2563eb" stroke-width="1.5"/>
    <text x="105" y="170" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Documents</text>
    <rect x="55" y="190" width="100" height="28" rx="4" fill="#1e293b"/>
    <text x="105" y="208" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Chunking</text>
    <rect x="55" y="230" width="100" height="28" rx="4" fill="#1e293b"/>
    <text x="105" y="248" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Embeddings</text>
    <rect x="55" y="270" width="100" height="28" rx="4" fill="#1e293b"/>
    <text x="105" y="288" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Metadata Tag</text>

    <!-- Arrow -->
    <path d="M170 250 L220 250" stroke="#3b82f6" stroke-width="2"/>

    <!-- Stage 2: Vector Search -->
    <rect x="220" y="140" width="150" height="220" rx="8" fill="#131b2e" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="295" y="170" fill="#22d3ee" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Dense Retrieval</text>
    <circle cx="295" cy="220" r="30" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="295" y="224" fill="#67e8f9" font-family="monospace" font-size="10" text-anchor="middle">Vector DB</text>
    <text x="295" y="280" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Top-K Passages</text>
    <text x="295" y="300" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Re-ranking Score</text>

    <!-- Arrow -->
    <path d="M370 250 L420 250" stroke="#06b6d4" stroke-width="2"/>

    <!-- Stage 3: LLM Synthesis -->
    <rect x="420" y="140" width="150" height="220" rx="8" fill="#131b2e" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="495" y="170" fill="#a78bfa" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. LLM Generator</text>
    <rect x="435" y="200" width="120" height="50" rx="6" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
    <text x="495" y="222" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Synthesize</text>
    <text x="495" y="238" fill="#c084fc" font-family="sans-serif" font-size="9" text-anchor="middle">Strict Context Bounded</text>
    <text x="495" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Reduced Hallucination</text>

    <!-- Arrow -->
    <path d="M570 250 L620 250" stroke="#10b981" stroke-width="2"/>

    <!-- Stage 4: Grounded Citations -->
    <rect x="620" y="140" width="140" height="220" rx="8" fill="#131b2e" stroke="#10b981" stroke-width="2"/>
    <text x="690" y="170" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4. Citations</text>
    <rect x="635" y="195" width="110" height="32" rx="4" fill="#064e3b"/>
    <text x="690" y="215" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">[Source: §3.2]</text>
    <rect x="635" y="240" width="110" height="32" rx="4" fill="#064e3b"/>
    <text x="690" y="260" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">[Passage: §1.4]</text>
    <text x="690" y="310" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Verifiable Proof</text>
    <text x="690" y="328" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Traceable Attribution</text>
  </svg>