<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
    <rect width="800" height="450" rx="16" fill="#0c121e"/>
    <rect x="2" y="2" width="796" height="446" rx="14" stroke="#1e293b" stroke-width="2"/>
    <text x="40" y="50" fill="#06b6d4" font-family="monospace" font-size="14" font-weight="600">SPATIAL AI // 2024</text>
    <text x="40" y="80" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Monocular Depth Estimation for Real-Time Scenes</text>

    <rect x="60" y="150" width="180" height="160" rx="8" fill="#162032" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="150" y="180" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Monocular RGB Input</text>
    <rect x="80" y="200" width="140" height="80" rx="4" fill="#0f172a"/>
    <circle cx="120" cy="240" r="16" fill="#22c55e"/>
    <polygon points="150,260 180,220 210,260" fill="#3b82f6"/>
    <text x="150" y="300" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Single Sensor Stream</text>

    <path d="M250 230 L320 230" stroke="#06b6d4" stroke-width="2"/>

    <rect x="320" y="140" width="180" height="180" rx="8" fill="#1a1c30" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="410" y="170" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Deep Estimation Net</text>
    <text x="410" y="205" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Encoder: Feature Maps</text>
    <text x="410" y="230" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Decoder: Multi-scale</text>
    <text x="410" y="255" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Continuous Prediction</text>

    <path d="M510 230 L580 230" stroke="#8b5cf6" stroke-width="2"/>

    <rect x="580" y="150" width="180" height="160" rx="8" fill="#162032" stroke="#10b981" stroke-width="2"/>
    <text x="670" y="180" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Continuous Depth Map</text>
    <rect x="600" y="200" width="140" height="80" rx="4" fill="url(#depthGrad)"/>
    <defs>
      <linearGradient id="depthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4c1d95"/>
        <stop offset="50%" stop-color="#2563eb"/>
        <stop offset="100%" stop-color="#facc15"/>
      </linearGradient>
    </defs>
    <text x="670" y="300" fill="#6ee7b7" font-family="sans-serif" font-size="9" text-anchor="middle">Pixel-Wise Metric Distance</text>
  </svg>