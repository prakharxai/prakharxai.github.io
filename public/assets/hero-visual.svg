<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="labCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Glowing core background -->
  <circle cx="300" cy="300" r="260" fill="url(#labCore)" />
  
  <!-- Outer coordinate rings -->
  <circle cx="300" cy="300" r="240" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" />
  <circle cx="300" cy="300" r="170" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 4" opacity="0.4" />
  <circle cx="300" cy="300" r="100" stroke="#8b5cf6" stroke-width="1" opacity="0.5" />

  <!-- Document OCR Bounding Box Motif -->
  <rect x="180" y="140" width="90" height="60" rx="4" fill="#0e1726" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="190" y="152" width="50" height="6" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="190" y="164" width="70" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>
  <rect x="190" y="174" width="60" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>
  <text x="260" y="148" fill="#22d3ee" font-family="monospace" font-size="8">OCR_BBOX</text>

  <!-- Knowledge Graph Nodes & Attention Connections -->
  <line x1="300" y1="300" x2="225" y2="170" stroke="url(#edgeCyan)" stroke-width="1.5"/>
  <line x1="300" y1="300" x2="420" y2="180" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
  <line x1="300" y1="300" x2="440" y2="340" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
  <line x1="300" y1="300" x2="190" y2="380" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
  <line x1="300" y1="300" x2="330" y2="460" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  
  <line x1="225" y1="170" x2="420" y2="180" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="420" y1="180" x2="440" y2="340" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="440" y1="340" x2="330" y2="460" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="330" y1="460" x2="190" y2="380" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Satellite Nodes -->
  <!-- NLP / Embeddings -->
  <g transform="translate(420, 180)">
    <circle r="22" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
    <circle r="30" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <text y="4" fill="#c084fc" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">EMBED</text>
  </g>

  <!-- Healthcare / Hospital OCR -->
  <g transform="translate(440, 340)">
    <circle r="24" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <circle r="34" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <text y="4" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">HEALTH</text>
  </g>

  <!-- RAG Grounded Citations -->
  <g transform="translate(190, 380)">
    <circle r="22" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text y="4" fill="#fde68a" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">RAG</text>
  </g>

  <!-- Computer Vision -->
  <g transform="translate(330, 460)">
    <circle r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text y="4" fill="#7dd3fc" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">VISION</text>
  </g>

  <!-- Center Signature Hub -->
  <circle cx="300" cy="300" r="44" fill="#0f172a" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="300" cy="300" r="54" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.6"/>
  <circle cx="300" cy="300" r="10" fill="#06b6d4"/>
  <text x="300" y="295" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PRAKHAR</text>
  <text x="300" y="312" fill="#38bdf8" font-family="monospace" font-size="8" font-weight="600" text-anchor="middle">AI LAB</text>
</svg>
